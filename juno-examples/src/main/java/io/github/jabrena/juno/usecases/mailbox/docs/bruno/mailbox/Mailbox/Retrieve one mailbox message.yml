info:
  name: Retrieve one mailbox message
  type: http
  seq: 3
  tags:
    - Mailbox

http:
  method: GET
  url: "{{baseUrl}}/api/v1/mailbox/:uuid"
  params:
    - name: uuid
      value: "{{uuid}}"
      type: path
      description: The exact uuid value returned in a mailbox message.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: The requested message.
    request:
      url: "{{baseUrl}}/api/v1/mailbox/:uuid"
      method: GET
      params:
        - name: uuid
          value: 6f0a6a4b-36b8-4dc9-bc67-8f4a3bfb2d61
          type: path
          description: The exact uuid value returned in a mailbox message.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "uuid": "6f0a6a4b-36b8-4dc9-bc67-8f4a3bfb2d61",
            "title": "Hello",
            "body": "Detail of the message",
            "createAt": "2026-10-25T11:10:00"
          }
  - name: 404 Response
    description: No message exists with the requested uuid.
    request:
      url: "{{baseUrl}}/api/v1/mailbox/:uuid"
      method: GET
      params:
        - name: uuid
          value: 6f0a6a4b-36b8-4dc9-bc67-8f4a3bfb2d61
          type: path
          description: The exact uuid value returned in a mailbox message.
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "No mailbox message at /api/v1/mailbox/unknown",
            "status": 404
          }
  - name: 405 Response
    description: The HTTP method is not supported for this resource.
    request:
      url: "{{baseUrl}}/api/v1/mailbox/:uuid"
      method: GET
      params:
        - name: uuid
          value: 6f0a6a4b-36b8-4dc9-bc67-8f4a3bfb2d61
          type: path
          description: The exact uuid value returned in a mailbox message.
    response:
      status: 405
      statusText: Method Not Allowed
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "No mailbox message at /api/v1/mailbox/unknown",
            "status": 404
          }
