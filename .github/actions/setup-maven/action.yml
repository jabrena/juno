name: Set up JDK and Maven
description: >-
  JDK 27, a Maven cache scoped to the calling job, and the Maven wrapper's distribution fetched with retries.
  The wrapper downloads Maven itself with one wget/curl call and no retry, so on a cold cache, when about 20 jobs
  start together, Maven Central can refuse it with 429 Too Many Requests before Maven (and its own resolver retries)
  ever runs.

inputs:
  cache-scope:
    description: >-
      Cache key scope. One cache per job: a single shared key keeps only what the first job to finish downloaded, so
      the others fetch the rest from Maven Central at the same time. Matrix jobs whose entries pull different
      dependencies add the matrix value.
    required: false
    default: ${{ github.job }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 27
    - uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: maven-${{ runner.os }}-${{ inputs.cache-scope }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
          maven-${{ runner.os }}-${{ inputs.cache-scope }}-
          maven-${{ runner.os }}-
    - name: Fetch the Maven wrapper distribution
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          if ./mvnw --version > /dev/null; then
            exit 0
          fi
          echo "::warning::Maven wrapper download failed (attempt $attempt of 5); retrying in $((attempt * 20)) s"
          sleep $((attempt * 20))
        done
        ./mvnw --version
