name: CI Builds

on: [push]

jobs:
  run:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetches all submodules
      # .sdkmanrc pins 25.2.4-graalce, which is the GraalVM CE release number; the JDK it
      # ships is 25.0.4. setup-java can't resolve that identifier, so pin the JDK explicitly.
      - name: Set up JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'
          distribution: 'graalvm-community'
          cache: 'maven'
      - name: Maven build
        run: ./mvnw --batch-mode --no-transfer-progress verify --file pom.xml