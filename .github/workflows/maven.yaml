name: CI Builds

on: [push]

jobs:
  run:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetches all submodules
      # .sdkmanrc pins 27.0.0.0+35-tem (Temurin 27).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '27'
          cache: 'maven'
      - name: Maven build
        run: ./mvnw --batch-mode --no-transfer-progress verify --file pom.xml
      # The Testcontainers profiles live in the juno module and are opt-in locally (see AGENTS.md);
      # Docker is preinstalled on the runner.
      - name: Compile API and shield fixtures with arduino-cli (Testcontainers)
        run: ./mvnw --batch-mode --no-transfer-progress -Parduino-cli verify --file juno/pom.xml
      - name: Run programs under QEMU (Testcontainers)
        run: ./mvnw --batch-mode --no-transfer-progress -Pqemu verify --file juno/pom.xml
