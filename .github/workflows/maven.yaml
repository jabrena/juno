name: CI Builds

on: [push]

jobs:
  run:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetches all submodules
      # .sdkmanrc pins 25.2.4-graalce: GraalVM CE "25 Innovation 2" (JDK 25.0.4), published under
      # the graal-25.2.4 tag. Neither setup-java nor setup-graalvm resolves Innovation releases,
      # so download that exact build and install it as a local JDK file.
      - name: Download GraalVM CE 25.2.4
        run: |
          curl -fsSL -o "$RUNNER_TEMP/graalvm.tar.gz" \
            https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.2.4/graalvm-community-jdk-25i2-25.0.4_linux-x64_bin.tar.gz
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/graalvm.tar.gz
          java-version: '25.0.4'
          cache: 'maven'
      - name: Maven build
        run: ./mvnw --batch-mode --no-transfer-progress verify --file pom.xml
      # The Testcontainers profiles are opt-in locally (see AGENTS.md). They resolve the juno artifacts from the
      # local repository, so install the reactor once without re-running tests; Docker is preinstalled on the runner.
      - name: Install reactor artifacts
        run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests --file pom.xml
      - name: Compile games with arduino-cli (Testcontainers)
        run: ./mvnw --batch-mode --no-transfer-progress -Parduino-cli verify --file juno-examples/pom.xml
      - name: Run programs under QEMU (Testcontainers)
        run: ./mvnw --batch-mode --no-transfer-progress -Pqemu verify --file juno-examples/pom.xml
