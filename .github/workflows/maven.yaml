name: CI Builds

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
      - 'docs/**'
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  release:
    types: [published]

# About 20 jobs start together; on a cold or new per-job Maven cache they all fetch from Maven Central at once, which can
# answer 429 Too Many Requests. Resolver retries 429/503 by default only 3 times, 5 s apart; wait it out longer.
env:
  MAVEN_ARGS: >-
    -Daether.transport.http.retryHandler.count=10
    -Daether.transport.http.retryHandler.interval=10000

jobs:
  changes:
    name: Select integration coverage
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      java: ${{ steps.select.outputs.java }}
      kotlin: ${{ steps.select.outputs.kotlin }}
      scala: ${{ steps.select.outputs.scala }}
      clojure: ${{ steps.select.outputs.clojure }}
      groovy: ${{ steps.select.outputs.groovy }}
      arduino: ${{ steps.select.outputs.arduino }}
      other_arduino: ${{ steps.select.outputs.other_arduino }}
      board_scope: ${{ steps.select.outputs.board_scope }}
      arduino_languages: ${{ steps.select.outputs.arduino_languages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != push || "$REF_TYPE" == tag ]]; then
            changed_files="__full__"
            full=true
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            changed_files="$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA")"
            full=false
          else
            # A new branch has no previous push: compare every commit since it left the default branch, not just the tip.
            base="$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA")"
            changed_files="$(git diff --name-only "$base" "$GITHUB_SHA")"
            full=false
          fi

          changed() {
            grep -Eq "$1" <<<"$changed_files"
          }

          if changed '^(pom.xml|\.mvn/|\.github/workflows/maven\.yaml|juno-api/|juno-compiler/|juno-maven-plugin/|juno-third-parties/|juno-examples/pom.xml|juno-examples/src/test/)'; then
            full=true
          fi

          java=false
          kotlin=false
          scala=false
          clojure=false
          groovy=false
          if changed '^juno-examples/src/main/java/io/github/jabrena/juno/language/'; then java=true; fi
          if changed '^juno-examples/src/main/kotlin/io/github/jabrena/juno/language/kotlin/'; then kotlin=true; fi
          if changed '^juno-examples/src/main/scala/io/github/jabrena/juno/language/scala/'; then scala=true; fi
          if changed '^juno-examples/src/main/clojure/io/github/jabrena/juno/language/clojure/'; then clojure=true; fi
          if changed '^juno-examples/src/main/groovy/io/github/jabrena/juno/language/groovy/'; then groovy=true; fi

          if [[ "$full" == true ]]; then
            java=true
            kotlin=true
            scala=true
            clojure=true
            groovy=true
            board_scope=all
            other_arduino=true
            arduino_languages='["full","kotlin","scala","clojure","groovy"]'
          else
            board_scope=representative
            arduino_languages='['
            separator=''
            for language in kotlin scala clojure groovy; do
              if [[ "${!language}" == true ]]; then
                arduino_languages+="${separator}\"$language\""
                separator=,
              fi
            done
            arduino_languages+=']'
            if [[ -n "$separator" ]]; then
              other_arduino=true
            else
              other_arduino=false
              arduino_languages='["none"]'
            fi
          fi

          arduino=false
          if [[ "$java" == true || "$kotlin" == true || "$scala" == true || "$clojure" == true || "$groovy" == true ]]; then
            arduino=true
          fi

          {
            echo "full=$full"
            echo "java=$java"
            echo "kotlin=$kotlin"
            echo "scala=$scala"
            echo "clojure=$clojure"
            echo "groovy=$groovy"
            echo "arduino=$arduino"
            echo "other_arduino=$other_arduino"
            echo "board_scope=$board_scope"
            echo "arduino_languages=$arduino_languages"
          } >> "$GITHUB_OUTPUT"

  # Toolchain image phase: downstream build, emulator, and language jobs consume these immutable references.
  arduino-cli-image:
    name: Publish Arduino CLI image
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.reference.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: reference
        shell: bash
        run: |
          set -euo pipefail
          digest="$(git ls-files -z -- juno-compiler/src/test/docker/arduino-cli | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/juno-arduino-cli:sha-$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          IMAGE: ${{ steps.reference.outputs.ref }}
        shell: bash
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.exists != 'true'
      - uses: docker/build-push-action@v7
        if: steps.image.outputs.exists != 'true'
        with:
          context: juno-compiler/src/test/docker/arduino-cli
          push: true
          tags: ${{ steps.reference.outputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=arduino-cli-image
          cache-to: type=gha,mode=max,scope=arduino-cli-image

  qemu-image:
    name: Publish QEMU image
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.reference.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: reference
        shell: bash
        run: |
          set -euo pipefail
          digest="$(git ls-files -z -- \
            juno-compiler/src/test/docker/qemu/Dockerfile \
            juno-compiler/src/test/docker/qemu/Arduino.h \
            juno-compiler/src/test/docker/qemu/Arduino_LED_Matrix.h \
            juno-compiler/src/test/docker/qemu/Arduino_RouterBridge.h \
            juno-compiler/src/test/docker/qemu/link.ld \
            juno-compiler/src/test/docker/qemu/run.sh \
            juno-compiler/src/test/docker/qemu/startup.cpp \
            juno-compiler/src/test/docker/qemu/zephyr/kernel.h \
            | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/juno-qemu:sha-$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          IMAGE: ${{ steps.reference.outputs.ref }}
        shell: bash
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.exists != 'true'
      - uses: docker/build-push-action@v7
        if: steps.image.outputs.exists != 'true'
        with:
          context: juno-compiler/src/test/docker/qemu
          push: true
          tags: ${{ steps.reference.outputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=qemu-image
          cache-to: type=gha,mode=max,scope=qemu-image

  simavr-image:
    name: Publish simavr image
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.reference.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: reference
        shell: bash
        run: |
          set -euo pipefail
          digest="$(git ls-files -z -- \
            juno-compiler/src/test/docker/simavr/Dockerfile \
            juno-compiler/src/test/docker/simavr/Arduino.h \
            juno-compiler/src/test/docker/simavr/SPI.h \
            juno-compiler/src/test/docker/simavr/SdFat.h \
            juno-compiler/src/test/docker/simavr/WiFiNINA.h \
            juno-compiler/src/test/docker/simavr/WiFiUdp.h \
            juno-compiler/src/test/docker/simavr/run.sh \
            juno-compiler/src/test/docker/simavr/runner.c \
            juno-compiler/src/test/docker/simavr/startup.cpp \
            | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/juno-simavr:sha-$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          IMAGE: ${{ steps.reference.outputs.ref }}
        shell: bash
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.exists != 'true'
      - uses: docker/build-push-action@v7
        if: steps.image.outputs.exists != 'true'
        with:
          context: juno-compiler/src/test/docker/simavr
          push: true
          tags: ${{ steps.reference.outputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=simavr-image
          cache-to: type=gha,mode=max,scope=simavr-image

  xtensa-image:
    name: Publish Xtensa image
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.reference.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: reference
        shell: bash
        run: |
          set -euo pipefail
          digest="$(git ls-files -z -- \
            juno-compiler/src/test/docker/xtensa/Dockerfile \
            juno-compiler/src/test/docker/xtensa/merge_flash.sh \
            juno-compiler/src/test/docker/xtensa/run.sh \
            juno-compiler/src/test/docker/xtensa/variant.cpp \
            | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/juno-xtensa:sha-$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          IMAGE: ${{ steps.reference.outputs.ref }}
        shell: bash
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.exists != 'true'
      - uses: docker/build-push-action@v7
        if: steps.image.outputs.exists != 'true'
        with:
          context: juno-compiler/src/test/docker/xtensa
          push: true
          tags: ${{ steps.reference.outputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=xtensa-image
          cache-to: type=gha,mode=max,scope=xtensa-image

  build:
    name: Build
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-maven
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress verify -b turbo -T1C

      - name: Javadoc gate for juno-api
        env:
          # Ratchet: undocumented public members and empty package descriptions may not grow past this count.
          # Lower it as members are documented; never raise it.
          NO_COMMENT_BASELINE: "232"
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress -q -pl juno-api dependency:build-classpath \
            -Dmdep.outputFile="$RUNNER_TEMP/juno-api.classpath"
          sources="$(find juno-api/src/main/java -name '*.java')"
          log="$RUNNER_TEMP/javadoc-gate.log"
          # doclint reports undocumented members as warnings, so javadoc's exit status is ignored and the log is counted.
          javadoc -Xdoclint:all -Xmaxwarns 100000 -Xmaxerrs 100000 -quiet \
            -d "$RUNNER_TEMP/javadoc-gate" -cp "$(cat "$RUNNER_TEMP/juno-api.classpath")" $sources > "$log" 2>&1 || true
          errors="$(grep -c ': error: ' "$log" || true)"
          undocumented="$(grep -c ': warning: no comment' "$log" || true)"
          echo "doclint errors: $errors; undocumented (no comment): $undocumented; baseline: $NO_COMMENT_BASELINE"
          if (( errors > 0 )); then
            grep ': error: ' "$log"
            exit 1
          fi
          if (( undocumented > NO_COMMENT_BASELINE )); then
            grep ': warning: no comment' "$log"
            echo "::error::undocumented public members rose from $NO_COMMENT_BASELINE to $undocumented"
            exit 1
          fi
          if (( undocumented < NO_COMMENT_BASELINE )); then
            echo "::notice::undocumented count dropped below the baseline; lower NO_COMMENT_BASELINE to $undocumented"
          fi

  qemu:
    name: Run Thumb-2 programs under QEMU
    needs: [changes, qemu-image]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-maven
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull QEMU image
        run: docker pull ${{ needs.qemu-image.outputs.ref }}
      - name: Run Thumb-2 programs under QEMU
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -pl juno-compiler -am -Pqemu
          verify -Dtest=None -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=QemuRunIT
          -Djuno.qemuImage=${{ needs.qemu-image.outputs.ref }}
          -b turbo -T1C
      - name: Publish QEMU conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thumb2-conformance-junit
          path: juno-compiler/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7
      - name: Publish QEMU conformance failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thumb2-conformance-failure
          path: juno-compiler/target/qemu/generated/**
          if-no-files-found: warn
          retention-days: 7
      - name: Check QEMU conformance report entries
        if: always()
        run: java .github/scripts/ConformanceReportCheck.java juno-compiler/target/failsafe-reports

  simavr:
    name: Run AVR programs under simavr
    needs: [changes, simavr-image]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-maven
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull simavr image
        run: docker pull ${{ needs.simavr-image.outputs.ref }}
      - name: Run AVR programs under simavr
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -pl juno-compiler -am -Psimavr
          verify -Dtest=None -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=SimavrRunIT
          -Djuno.simavrImage=${{ needs.simavr-image.outputs.ref }}
          -b turbo -T1C
      - name: Publish simavr conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avr-conformance-junit
          path: juno-compiler/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7
      - name: Publish simavr conformance failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: avr-conformance-failure
          path: juno-compiler/target/simavr/generated/**
          if-no-files-found: warn
          retention-days: 7
      - name: Check simavr conformance report entries
        if: always()
        run: java .github/scripts/ConformanceReportCheck.java juno-compiler/target/failsafe-reports

  xtensa:
    name: Run Xtensa programs under QEMU (ESP32-S3)
    needs: [changes, xtensa-image]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-maven
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Xtensa image
        run: docker pull ${{ needs.xtensa-image.outputs.ref }}
      - name: Run Xtensa programs under QEMU (ESP32-S3)
        # About 21 min for 17 programs (~70 s each). XtensaRunIT bounds each program at 600 s; this step limit is the
        # backstop, and as a step timeout (not a job timeout) it still lets the failure-evidence upload below run.
        timeout-minutes: 45
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -pl juno-compiler -am -Pxtensa
          verify -Dtest=None -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=XtensaRunIT
          -Djuno.xtensaImage=${{ needs.xtensa-image.outputs.ref }}
          -b turbo -T1C
      - name: Publish Xtensa conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xtensa-conformance-junit
          path: juno-compiler/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7
      - name: Publish Xtensa conformance failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xtensa-conformance-failure
          path: juno-compiler/target/xtensa/generated/**
          if-no-files-found: warn
          retention-days: 7
      - name: Check Xtensa conformance report entries
        if: always()
        run: java .github/scripts/ConformanceReportCheck.java juno-compiler/target/failsafe-reports

  conformance-reports:
    name: Publish conformance reports
    needs: [changes, qemu, simavr, xtensa]
    if: always() && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Thumb-2 conformance report
        if: needs.qemu.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: thumb2-conformance-junit
          path: reports/qemu
      - name: Download AVR conformance report
        if: needs.simavr.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: avr-conformance-junit
          path: reports/simavr
      - name: Download Xtensa conformance report
        if: needs.xtensa.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: xtensa-conformance-junit
          path: reports/xtensa
      - name: Summarize conformance reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          report_count=0
          {
            echo "## Conformance reports"
            echo
            for backend in qemu simavr xtensa; do
              files=(reports/$backend/failsafe-reports/TEST-*.xml)
              if [[ -e "${files[0]}" ]]; then
                for report in "${files[@]}"; do
                  report_count=$((report_count + 1))
                  suite=$(sed -n 's/.*<testsuite[^>]*name="\([^"]*\)".*/\1/p' "$report" | head -1)
                  tests=$(sed -n 's/.*<testsuite[^>]*tests="\([0-9]*\)".*/\1/p' "$report" | head -1)
                  failures=$(sed -n 's/.*<testsuite[^>]*failures="\([0-9]*\)".*/\1/p' "$report" | head -1)
                  errors=$(sed -n 's/.*<testsuite[^>]*errors="\([0-9]*\)".*/\1/p' "$report" | head -1)
                  echo "- **$backend**: $suite — tests=$tests, failures=$failures, errors=$errors"
                done
              else
                echo "- **$backend**: no JUnit XML artifact was available"
              fi
            done
            echo
            echo "JUnit XML files collected: $report_count"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( report_count == 0 )); then
            echo "::warning::No QEMU, simavr or Xtensa JUnit XML report was available"
          fi
      - name: Publish consolidated conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-junit-reports
          path: reports/**
          if-no-files-found: warn
          retention-days: 7

  integration-build:
    name: Prepare integration build outputs
    needs: [changes]
    if: needs.changes.outputs.arduino == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-maven
      - name: Install reactor artifacts without integration tests
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -pl juno-examples -am install
          -DskipTests -DskipITs -b turbo -T1C
      - name: Package compiled outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/integration-build/m2/io/github/jabrena
          cp -a "$HOME/.m2/repository/io/github/jabrena/." .ci/integration-build/m2/io/github/jabrena/
          for module in juno-compiler juno-examples; do
            mkdir -p ".ci/integration-build/$module"
            cp -a "$module/target" ".ci/integration-build/$module/"
          done
          tar -czf integration-build.tar.gz -C .ci integration-build
      - uses: actions/upload-artifact@v7
        with:
          name: integration-build-${{ github.sha }}
          path: integration-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  arduino:
    name: Compile ${{ matrix.language }}
    needs: [changes, arduino-cli-image, integration-build]
    if: needs.changes.outputs.other_arduino == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.arduino_languages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-maven
        with:
          cache-scope: ${{ github.job }}-${{ matrix.language }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Arduino CLI image
        run: docker pull ${{ needs.arduino-cli-image.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: integration-build-${{ github.sha }}
      - name: Restore integration build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          tar -xzf integration-build.tar.gz -C .ci
          cp -a .ci/integration-build/m2/. "$HOME/.m2/repository/"
          for module in juno-compiler juno-examples; do
            cp -a ".ci/integration-build/$module/target" "$module/"
          done
      - name: Compile API and shield fixtures
        if: matrix.language == 'full'
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -pl juno-compiler -Parduino-cli
          failsafe:integration-test failsafe:verify -Dit.test=ArduinoCliIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          -Djuno.arduinoCliImage=${{ needs.arduino-cli-image.outputs.ref }}
      - name: Compile language examples
        if: matrix.language != 'full'
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -pl juno-examples -Parduino-cli
          failsafe:integration-test failsafe:verify -Dit.test=LanguageExamplesArduinoCliIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          -Djuno.language=${{ matrix.language }}
          -Djuno.arduinoCliParallelism=6
          -Djuno.arduinoCliBoardScope=${{ needs.changes.outputs.board_scope }}
          -Djuno.arduinoCliImage=${{ needs.arduino-cli-image.outputs.ref }}

  arduino-java:
    name: Compile Java (${{ matrix.board }})
    needs: [changes, arduino-cli-image, integration-build]
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: UNO R3
            board_id: arduino-uno-r3
          - board: UNO WiFi Rev2
            board_id: arduino-uno-r3-wifi-rev2
          - board: UNO R4 WiFi
            board_id: arduino-uno-r4-wifi
          - board: Nano ESP32
            board_id: arduino-nano-esp32
          - board: UNO Q
            board_id: arduino-uno-q
          - board: M5Stack Cardputer
            board_id: m5stack-cardputer
          - board: Raspberry Pi Pico 2 W
            board_id: raspberry-pi-pico-2-w
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-maven
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Arduino CLI image
        run: docker pull ${{ needs.arduino-cli-image.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: integration-build-${{ github.sha }}
      - name: Restore integration build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          tar -xzf integration-build.tar.gz -C .ci
          cp -a .ci/integration-build/m2/. "$HOME/.m2/repository/"
          for module in juno-compiler juno-examples; do
            cp -a ".ci/integration-build/$module/target" "$module/"
          done
      - name: Compile Java examples
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -pl juno-examples -Parduino-cli
          failsafe:integration-test failsafe:verify -Dit.test=LanguageExamplesArduinoCliIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          -Djuno.language=java
          -Djuno.arduinoCliBoards=${{ matrix.board_id }}
          -Djuno.arduinoCliParallelism=4
          -Djuno.arduinoCliBoardScope=${{ needs.changes.outputs.board_scope }}
          -Djuno.arduinoCliImage=${{ needs.arduino-cli-image.outputs.ref }}
