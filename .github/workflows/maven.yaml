name: CI Builds

on:
  push:
    # Skip the builds when a push only changes documentation or images; any other file in the push runs them.
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
      # The generated site (GitHub Pages); its sources live in juno-site and still trigger a build.
      - 'docs/**'

jobs:
  run:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The three builds are independent, so they run in parallel on separate runners; one failing does not cancel
    # the others, so every result is reported.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            command: ./mvnw --batch-mode --no-transfer-progress verify --file pom.xml
          # The Testcontainers profiles live in the juno-compiler module and are opt-in locally (see AGENTS.md);
          # Docker is preinstalled on the runner. Their unit tests already run in "Build", so these two jobs skip
          # them (-Dtest=None) and run only their integration tests.
          - name: Compile API and shield fixtures with arduino-cli (Testcontainers)
            # Uses the image the steps below build from the GitHub Actions cache, instead of letting the test
            # download the Arduino cores and libraries again on every run.
            arduino-cli-image: juno-arduino-cli:ci
            command: >-
              ./mvnw --batch-mode --no-transfer-progress -Parduino-cli verify -pl juno-compiler -am
              -Djuno.arduinoCliImage=juno-arduino-cli:ci -Dtest=None -Dsurefire.failIfNoSpecifiedTests=false
          # The language examples have their own arduino-cli profile in juno-examples. -Dit.test selects only
          # LanguageExamplesArduinoCliIT, so the fixture integration tests above do not run again here.
          - name: Compile language examples with arduino-cli (Testcontainers)
            arduino-cli-image: juno-arduino-cli:ci
            command: >-
              ./mvnw --batch-mode --no-transfer-progress -Parduino-cli verify -pl juno-examples -am
              -Djuno.arduinoCliImage=juno-arduino-cli:ci -Dit.test=LanguageExamplesArduinoCliIT
              -Dfailsafe.failIfNoSpecifiedTests=false
          - name: Run programs under QEMU (Testcontainers)
            command: >-
              ./mvnw --batch-mode --no-transfer-progress -Pqemu verify -pl juno-compiler -am
              -Dtest=None -Dsurefire.failIfNoSpecifiedTests=false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetches all submodules
      # .sdkmanrc pins 27.0.0.0+35-tem (Temurin 27).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '27'
          cache: 'maven'
      # The arduino-cli image only changes with its Dockerfile, so its layers come from the GitHub Actions cache
      # and Docker rebuilds only the layers after a change. `load` puts it in the runner's Docker for the test.
      - name: Set up Docker Buildx
        if: matrix.arduino-cli-image
        uses: docker/setup-buildx-action@v4
      - name: Build arduino-cli image (cached)
        if: matrix.arduino-cli-image
        uses: docker/build-push-action@v7
        with:
          context: juno-compiler/src/test/docker/arduino-cli
          tags: ${{ matrix.arduino-cli-image }}
          load: true
          cache-from: type=gha,scope=arduino-cli
          cache-to: type=gha,mode=max,scope=arduino-cli
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
