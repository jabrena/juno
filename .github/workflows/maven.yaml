name: CI Builds

on: [push]

jobs:
  run:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetches all submodules
      # .sdkmanrc pins 27.0.0.0+35-tem (Temurin 27).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '27'
          cache: 'maven'
      - name: Maven build
        run: ./mvnw --batch-mode --no-transfer-progress verify --file pom.xml
      # The Testcontainers profiles are opt-in locally (see AGENTS.md). They resolve the juno artifacts from the
      # local repository, so install the reactor once without re-running tests; Docker is preinstalled on the runner.
      - name: Install reactor artifacts
        run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests --file pom.xml
      - name: Compile games with arduino-cli (Testcontainers)
        run: ./mvnw --batch-mode --no-transfer-progress -Parduino-cli verify --file juno-examples/pom.xml
      - name: Run programs under QEMU (Testcontainers)
        run: ./mvnw --batch-mode --no-transfer-progress -Pqemu verify --file juno-examples/pom.xml
