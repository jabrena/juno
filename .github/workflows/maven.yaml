name: CI Builds

on: [push]

jobs:
  run:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetches all submodules
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
          cache: 'maven'
      - name: Maven build
        run: ./mvnw --batch-mode --no-transfer-progress verify --file pom.xml