version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only; the local composite actions pin their own action versions.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
      time: "05:00"