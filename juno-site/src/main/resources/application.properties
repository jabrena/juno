quarkus.application.name=juno-site

site.url=https://jabrena.github.io/juno

# quarkus:run only ever serves one purpose for this module: batch-export the static site and exit.
# Scoped to the prod profile so it doesn't affect quarkus:dev (live preview) or mvn test.
%prod.quarkus.roq.generator.batch=true

# jabrena/juno is a GitHub Pages *project* site: served under https://jabrena.github.io/juno/,
# not at the domain root. Without this, every generated absolute path (css/js/images/nav links)
# is root-relative and 404s on GitHub Pages, even though it happens to resolve locally when
# jwebserver serves docs/ itself as the root. Scoped to prod only — quarkus:dev keeps serving
# unprefixed at its own root, which is what you want while live-editing.
%prod.quarkus.http.root-path=/juno

# The migrated docs are full of literal ${...} (Maven properties) and {...} (code examples).
# None of them need live Qute expressions, so skip expression parsing entirely for these pages.
site.escaped-pages=*.md
