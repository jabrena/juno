{! Overrides the roq-default page header: a left-aligned title only. The description stays in the
   page's <meta> tags but is no longer shown under the title, and the separator line is gone. !}
{#if page.data('show-header', true)}
<header class="juno-page-header">
  <h1>{page.title}</h1>
</header>
{/if}
