{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
{@java.util.List<io.vertx.core.json.JsonObject> menu}
{@java.lang.String menuTitle}

<section class="menu">
  <h3 class="section-title menu-title">{menuTitle ?: 'MENU'}</h3>
  <ul>
    {#for item in menu}
      {#if item.group??}
    <li class="menu-group"><span>{item.group}</span></li>
      {#else}
    <li><a class="{page.url.isActive(site.url(item.path).path) ? 'active' : ''}" href="{site.url(item.path)}" {#if item.target??}target="{item.target}"{/if}><i class="{item.icon}"></i>{item.title}</a></li>
      {/if}
    {/for}
  </ul>
</section>
